*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
 background:radial-gradient(700px 500px at 88% 12%,rgba(67,224,198,.22),transparent 70%),

.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;
 -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 100%)}
.left{position:absolute;left:72px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.brand svg{width:84px;height:84px}
.brand span{font:800 64px/1 "Bricolage Grotesque";letter-spacing:-1.5px}
h1{font:700 46px/1.1 "Bricolage Grotesque";letter-spacing:-1px;margin-bottom:26px}
h1 em{font-style:normal;color:#43e0c6}
p{font-size:23px;line-height:1.45;color:#c7d3d2;max-width:560px}
.tags{display:flex;gap:12px;margin-top:34px}
.tags b{font:600 17px Inter;padding:9px 16px;border-radius:99px;border:1.5px solid rgba(67,224,198,.45);color:#43e0c6;background:rgba(67,224,198,.08)}
.card{position:absolute;right:64px;top:92px;width:430px;background:#f7f4ed;color:#0a1f20;border-radius:26px;padding:30px;
 box-shadow:0 40px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.4);transform:rotate(2deg)}
.lbl{font:600 13px Inter;letter-spacing:.12em;text-transform:uppercase;color:#55696a}
.top{display:flex;align-items:center;justify-content:space-between;margin:10px 0 22px}
.sent{font:700 34px/1.15 "Bricolage Grotesque"}
.sent .bad{color:#c23a1e;text-decoration:underline wavy #c23a1e;text-underline-offset:7px}
.ring{position:relative;width:104px;height:104px;border-radius:50%;flex:none;margin-left:14px;
 background:conic-gradient(#007a7b 0 78%,#dfe8e6 0)}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:#f7f4ed}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font:800 34px "Bricolage Grotesque";font-style:normal;color:#035556}
.ph{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 22px}
.ph span{font:600 21px Inter;padding:9px 15px;border-radius:12px;background:#e3ecea;color:#035556}
.ph span.x{background:#ffd9d1;color:#c23a1e}
.bar{height:46px;border-radius:14px;background:#0a1f20;display:flex;align-items:center;gap:14px;padding:0 16px;color:#43e0c6;font:600 16px Inter}
.wave{display:flex;align-items:center;gap:3px;flex:1;height:26px}
.wave u{display:block;width:4px;border-radius:2px;background:#43e0c6}
